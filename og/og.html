<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Back to Focus card</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Source for site/assets/og.png (1200x630). Rendered with headless Chrome. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(900px 500px at 78% 40%, rgba(124,92,255,.45), transparent 70%), #030014;
    color: #fff; font-family: Manrope, sans-serif;
    display: grid; grid-template-columns: 1fr 360px; gap: 40px;
    padding: 64px 72px 0 72px;
  }
  .left { display: flex; flex-direction: column; padding-bottom: 64px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 30px; }
  .brand svg { width: 48px; height: 48px; }
  h1 { font-weight: 500; font-size: 64px; line-height: 1.05; letter-spacing: -.02em; margin-top: 56px;
    background: linear-gradient(180deg, #fff 30%, #C9BEFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: auto; font-size: 28px; color: #A9A3C2; }
  .phone {
    align-self: end; height: 566px; border: 10px solid #0B0820; border-bottom: 0;
    border-radius: 54px 54px 0 0; overflow: hidden; background: #000;
    box-shadow: 0 0 0 1px rgba(196,181,253,.3), 0 0 80px -10px rgba(124,92,255,.7);
  }
  .phone img { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#6D4AFF"/><path d="M20 7a9 9 0 1 0 5 15.5A8 8 0 0 1 20 7z" fill="#fff"/></svg>
      Back to Focus
    </div>
    <h1>Open X or Instagram<br>during Focus.<br>Get sent back.</h1>
    <p class="sub">Free iPhone Shortcut for iOS 27</p>
  </div>
  <div class="phone"><img src="../site/assets/shortcut-preview.png" alt=""></div>
</body>
</html>
